{% extends "base.html" %}

{% block title %}{{ status_code }} {{ error_title }} - StrfryGUI{% endblock %}

{% block content %}
<div class="legacy-shell error-shell">
    <section class="legacy-panel" aria-labelledby="errorTitle">
        <header class="legacy-panel-header">
            <span class="error-code">{{ status_code }}</span>
            <h1 id="errorTitle">{{ error_title }}</h1>
            <p>{{ error_message }}</p>
        </header>
        <div class="legacy-panel-body">
            <a href="{{ recovery_url }}" class="btn btn-primary">{{ recovery_label }}</a>
        </div>
    </section>
</div>
{% endblock %}
